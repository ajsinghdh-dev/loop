<style>
:root{
 --bg:#F4F1FA;--card:#FFFFFF;--ink:#1F1D2B;--muted:#7C7891;--line:#ECE8F4;
 --lav:#D9CCF0;--lav2:#B9A3E6;--lavd:#7C5CD6;--mint:#CFE7E0;--mintd:#3E9B83;
 --peach:#FBDCCB;--peachd:#D9774A;--sky:#CFDDF7;--skyd:#4C78D0;--lemon:#FBEBB0;--lemond:#C79A12;
 --good:#3FB27F;--bad:#E8657A;--r:28px;
 --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;padding:calc(18px + var(--safe-t)) 18px calc(110px + var(--safe-b))}
.dash{display:block}
.rail{display:none}
.kbd{display:none}
@media(min-width:900px){
 body{background:radial-gradient(1200px 600px at 10% 0%,#EADFFB 0,transparent 60%),radial-gradient(900px 500px at 100% 100%,#D8F0E8 0,transparent 60%),var(--bg)}
 .app{max-width:1360px;display:grid;grid-template-columns:250px 1fr;gap:36px;padding:28px 36px 40px}
 .side{display:flex!important}
 .nav{display:none!important}
 .grid2{grid-template-columns:1fr 1fr!important}
 h1{font-size:44px}
 .pills{margin:0;padding-left:0;flex-wrap:wrap}
 .dash{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
 .rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:28px}
 .ccard:hover{transform:translateY(-3px);box-shadow:0 14px 30px #6d5aa31f}
 .ccard{transition:transform .2s,box-shadow .2s}
 .topic[data-course]:hover,.topic[data-cram]:hover{transform:translateX(3px)}
 .topic{transition:transform .15s}
 .side button:not(.on):hover{background:var(--bg);color:var(--ink)}
 .hero{max-width:none;flex-direction:row;min-height:100dvh}
 .hero .art{flex:1.1}
 .hero .sheet{flex:0 0 520px;border-radius:40px 0 0 40px;display:flex;flex-direction:column;justify-content:center;padding:60px 64px;text-align:left}
 .hero .sheet h1{text-align:left!important;font-size:46px}
 .hero .art svg{width:340px;height:340px}
 .quiz{max-width:none;padding:36px;align-items:center;background:radial-gradient(900px 500px at 0 0,#EADFFB,transparent 60%),var(--bg)}
 .quiz>*{width:100%;max-width:760px}
 .qtext{font-size:26px}
 .opts{grid-template-columns:1fr 1fr}
 .opt{min-height:84px}
 .kbd{display:block;text-align:center;font-size:13px;color:var(--muted);margin-top:12px}
 .kbd b{display:inline-block;background:#fff;border-radius:6px;padding:1px 7px;margin:0 2px;box-shadow:0 1px 0 #0002;font-weight:600}
 .big3 .n{font-size:34px}
}
.side{display:none;flex-direction:column;gap:6px;position:sticky;top:32px;height:calc(100dvh - 64px);background:var(--card);border-radius:var(--r);padding:22px 14px}
.side .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;padding:0 10px 18px}
.side button{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;font-weight:500;color:var(--muted);text-align:left}
.side button.on{background:var(--ink);color:#fff}
.main{min-width:0}
h1{font-size:32px;line-height:1.12;font-weight:700;margin:6px 0 18px;letter-spacing:-.02em}
h2{font-size:20px;font-weight:700;margin:26px 0 12px;letter-spacing:-.01em}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.iconbtn{width:52px;height:52px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 2px 0 var(--line)}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--lav);display:grid;place-items:center;font-weight:700;font-size:20px;color:var(--lavd)}
.bar{height:8px;border-radius:9px;background:#fff;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:9px;background:var(--lav2);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin:0 -18px;padding-left:18px;padding-right:18px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;padding:9px 16px;border-radius:99px;background:var(--card);font-size:14px;font-weight:500;color:var(--muted);display:flex;gap:6px;align-items:center}
.pill.on{background:var(--ink);color:#fff}
.pill b{font-size:11px;background:var(--lav);color:var(--lavd);border-radius:99px;padding:1px 7px}
.pill.on b{background:#fff2;color:#fff}
.card{background:var(--card);border-radius:var(--r);padding:20px;position:relative;overflow:hidden}
.ccard{border-radius:var(--r);padding:20px;position:relative;overflow:hidden;cursor:pointer;transition:transform .15s}
.ccard:active{transform:scale(.98)}
.ccard .sparkle{position:absolute;right:-10px;top:30px;opacity:.35;font-size:90px;pointer-events:none}
.c-mint{background:var(--mint)}.c-lav{background:var(--lav)}.c-peach{background:var(--peach)}.c-sky{background:var(--sky)}.c-lemon{background:var(--lemon)}
.chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.glyph{width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px}
.go{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;position:relative}
.go svg.ring{position:absolute;inset:-4px}
.stack{display:grid;gap:14px}
.grid2{display:grid;gap:14px;grid-template-columns:1fr}
.stat{border-radius:24px;padding:16px}
.stat .n{font-size:30px;font-weight:800;line-height:1}
.stat .l{font-size:13px;font-weight:500;color:var(--ink);opacity:.7;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:16px 28px;border-radius:99px;background:var(--ink);color:#fff;font-weight:600;font-size:16px}
.btn.light{background:#fff;color:var(--ink)}
.btn.full{width:100%}
.btn:disabled{opacity:.4}
.circ{width:64px;height:64px;border-radius:50%;background:var(--lav2);display:grid;place-items:center;color:#fff;box-shadow:0 0 0 5px #fff, 0 0 0 7px var(--ink)}
/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safe-b));width:min(452px,calc(100% - 28px));background:var(--card);border-radius:30px;display:flex;justify-content:space-around;align-items:center;padding:10px 8px;box-shadow:0 10px 30px #6d5aa322;z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);font-weight:500;width:60px}
.nav button.on{color:var(--ink)}
.nav .mid{width:62px;height:62px;border-radius:50%;background:var(--lavd);color:#fff;margin-top:-34px;box-shadow:0 0 0 6px var(--bg);display:grid;place-items:center}
/* quiz */
.quiz{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;padding:calc(16px + var(--safe-t)) 18px calc(18px + var(--safe-b));max-width:640px;margin:0 auto;overflow-y:auto}
.qtop{display:flex;align-items:center;gap:12px}
.dots{flex:1;display:flex;gap:5px}
.dots i{flex:1;height:8px;border-radius:9px;background:#fff}
.dots i.d{background:var(--lav2)}.dots i.ok{background:var(--good)}.dots i.no{background:var(--bad)}
.qcard{margin-top:22px;border-radius:var(--r);padding:22px;animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
.qtag{font-size:13px;font-weight:600;opacity:.65;margin-bottom:8px}
.qtext{font-size:21px;font-weight:600;line-height:1.35}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border-radius:20px;padding:16px;font-size:16px;font-weight:500;border:2px solid transparent;transition:.15s}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.opt:hover{border-color:var(--lav2)}
.opt.ok{background:#E2F6EC;border-color:var(--good)}.opt.ok .k{background:var(--good);color:#fff}
.opt.no{background:#FDE7EB;border-color:var(--bad)}.opt.no .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.45}
.why{margin-top:14px;background:#fff;border-radius:20px;padding:16px;font-size:15px;line-height:1.5;animation:pop .3s}
.why b{display:block;font-size:17px;margin-bottom:4px}
.qfoot{margin-top:auto;padding-top:18px;display:flex;gap:10px}
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;background:#fff;border-radius:99px;padding:8px 12px}
@keyframes pop{from{transform:scale(.96) translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes float{50%{transform:translateY(-8px)}}
.float{animation:float 4s ease-in-out infinite}
/* hero */
.hero{min-height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:var(--lav)}
.hero .art{flex:1;display:grid;place-items:center;position:relative;padding-top:var(--safe-t)}
.hero .sheet{background:#fff;border-radius:36px 36px 0 0;padding:30px 24px calc(28px + var(--safe-b));text-align:center}
.hero h1{font-size:36px;text-align:center;margin:0 0 10px}
.field{width:100%;padding:16px 18px;border-radius:18px;border:2px solid var(--line);background:var(--bg);outline:none;margin-bottom:10px;font-size:16px}
.field:focus{border-color:var(--lav2)}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:4px 0}
.link{color:var(--lavd);font-weight:600}
/* chart */
.chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:24px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.chart .b{width:100%;max-width:38px;border-radius:99px;min-height:14px;position:relative;transition:height .8s cubic-bezier(.2,.8,.2,1)}
.chart .b span{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700}
.chart .b.top span{background:var(--lavd);color:#fff;border-radius:99px;padding:2px 7px;top:-26px}
.chart small{font-size:12px;color:var(--muted)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .h{font-size:13px;font-weight:600;color:var(--muted);padding:6px 0}
.cal .d{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:#fff;font-weight:600;font-size:15px;position:relative}
.cal .d.o{background:transparent;border:1.5px dashed #0001;color:var(--muted)}
.cal .d.ex{background:var(--lav2);color:#fff}
.cal .d.today{background:var(--ink);color:#fff}
.cal .d.done::after{content:'';position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--mintd)}
.topic{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:14px 16px}
.topic .nm{font-weight:600;font-size:15px}
.tag{font-size:11px;font-weight:700;border-radius:99px;padding:3px 9px;text-transform:uppercase;letter-spacing:.03em}
.tag.behind{background:#FDE7EB;color:var(--bad)}.tag.ok{background:#E2F6EC;color:var(--good)}.tag.soon{background:var(--bg);color:var(--muted)}.tag.new{background:var(--lemon);color:var(--lemond)}
.ring{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--c,var(--lavd)) calc(var(--p)*1%),#0000000d 0);display:grid;place-items:center;flex:none}
.ring>span{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.toast{position:fixed;left:50%;top:calc(16px + var(--safe-t));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font-weight:500;z-index:99;animation:pop .3s}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.big3 .stat{text-align:center;padding:14px 8px}
.big3 .n{font-size:26px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.switch{width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:none}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0002}
.switch.on{background:var(--lavd)}.switch.on::after{left:25px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

// q: question, o: options, a: correct index, e: why
window.QUESTIONS = [
// ---------- ENVIRSCI ----------
{t:'e1',q:'What does "Anthropocene" describe?',o:['An official geological epoch after the Holocene','A widely used term for the period when humans became a major influence on Earth systems','A period of natural climate cooling','The era before agriculture'],a:1,e:'It is NOT a formally recognized epoch (geologists rejected it in 2024), but it is widely used to describe profound human influence.'},
{t:'e1',q:'Graphs of the "Great Acceleration" mostly show…',o:['Gradual linear increase from 1800','Rapid acceleration starting around the mid-20th century','A peak in 1970 then decline','No consistent pattern'],a:1,e:'Many unrelated indicators (population, CO₂, water use) bend sharply upward around 1950.'},
{t:'e1',q:'An ecological footprint is…',o:['The population an area can support forever','Land needed to provide resources for, and absorb the waste of, a person or population','Total CO₂ a country emits','The area of protected land'],a:1,e:'Footprint = land to supply resources + assimilate waste.'},
{t:'e1',q:'Carrying capacity is…',o:['Fixed for every environment','The population size an area can support indefinitely','The number of species in an area','A country\'s total consumption'],a:1,e:'And it is NOT fixed — it depends on consumption, technology, trade and ecosystem productivity.'},
{t:'e1',q:'Which is NOT one of Jared Diamond\'s five factors for societal collapse?',o:['Natural climate change','Hostile neighbours','Lack of written language','Loss of friendly neighbours'],a:2,e:'The five: climate change, self-inflicted damage, failure to respond, hostile neighbours, loss of friendly neighbours.'},
{t:'e1',q:'For the Greenland Vikings, "failure to respond to the environment" meant…',o:['They refused to eat fish','They built too many ships','They moved inland','They overused solar power'],a:0,e:'They would not eat fish and refused Inuit help; overgrazing was the self-inflicted damage.'},
{t:'e1',q:'What does the ozone / Montreal Protocol story demonstrate?',o:['Damage repairs itself','Science alone solves problems','Coordinated science, policy, technology and cooperation can reverse dangerous trends','Global agreements don\'t work'],a:2,e:'Detect → identify cause → negotiate → substitute tech → monitor → change trajectory.'},
{t:'e1',q:'Sustainable development means…',o:['Zero economic growth','Meeting present needs without compromising future generations\' ability to meet theirs','Only protecting wilderness','Maximizing GDP'],a:1,e:'Classic definition; the UN 2030 Agenda (2015) built on it.'},
{t:'e1',q:'Sustainability → resilience → regeneration means…',o:['maintain → recover → improve','grow → shrink → stop','recover → maintain → collapse','improve → maintain → recover'],a:0,e:'"Beyond sustainability": sustain = maintain, resilience = recover, regeneration = improve.'},
{t:'e1',q:'The IPAT framework estimates impact from…',o:['Ice, Plants, Animals, Temperature','Population × Affluence × Technology','Policy, Action, Trade','Pollution × Agriculture × Transport'],a:1,e:'I = P × A × T.'},
{t:'e2',q:'Environmental science is best described as…',o:['A social movement to protect nature','An interdisciplinary field drawing on natural sciences, social sciences and humanities','A branch of biology only','Political advocacy'],a:1,e:'Environmentalism advocates; environmental science asks questions. You can be both but they\'re not the same.'},
{t:'e2',q:'Determining which crops suit a soil to help farmers decide is…',o:['Empirical science','Applied science','Not science','Environmentalism'],a:1,e:'Applied = practical use of knowledge. Studying soil composition itself would be empirical.'},
{t:'e2',q:'Which question is NOT scientifically testable?',o:['Why do bats get white-nose syndrome?','Why do humans need to protect bats from WNS?','How have mosquito numbers changed since WNS?','What genetic change made the fungus dangerous?'],a:1,e:'"Need to protect" is an ethical/value question — science can\'t settle it.'},
{t:'e2',q:'Good hypotheses must be…',o:['Proven correct','Testable, replicable and falsifiable','Based on opinion','Long and detailed'],a:1,e:'Hypotheses are supported or rejected — never "proven".'},
{t:'e2',q:'Hypothesis vs prediction:',o:['Same thing','A hypothesis explains; a prediction is the specific outcome you\'d see if the hypothesis is supported','A prediction comes before observation','A hypothesis is a fact'],a:1,e:'Hypothesis = possible explanation. Prediction = expected result in your specific test.'},
{t:'e2',q:'Which study type can show cause and effect?',o:['Observational','Experimental (manipulative) with control groups','Surveys','Case stories'],a:1,e:'Observational studies only show correlation; experiments manipulate variables.'},
{t:'e2',q:'Precision means…',o:['How close a value is to the true value','How close repeated measurements are to each other','Number of samples','How fast you measure'],a:1,e:'Accuracy = close to true value. Precision = close to each other.'},
{t:'e2',q:'Cities with more bicycles have healthier people. This shows…',o:['Bikes cause health','A correlation — other factors may explain it','Nothing at all','Health causes bikes, definitely'],a:1,e:'Correlation ≠ causation.'},
{t:'e2',q:'The precautionary principle says…',o:['Wait for 100% certainty','Act with a safety margin when data are uncertain and consequences could be severe','Never regulate chemicals','Let markets decide'],a:1,e:'E.g., the Montreal Protocol (1987) came before Solomon\'s 1988 confirming studies.'},
{t:'e2',q:'Science CANNOT by itself tell us…',o:['What is happening','Why it might be happening','What risks are acceptable','What interventions might do'],a:2,e:'Acceptable risk, who pays, and priorities are value choices.'},
{t:'e2',q:'Which book sparked the modern environmental movement?',o:['Braiding Sweetgrass','Silent Spring','Collapse','The Population Bomb'],a:1,e:'Rachel Carson, Silent Spring (1962).'},
{t:'e3',q:'Earth is a closed system for ___ but not for ___.',o:['energy, matter','matter, energy','carbon, nitrogen','water, carbon'],a:1,e:'Materially closed (matter cycles), energetically open (sunlight in, heat out).'},

{t:'e3',q:'A population with high species richness but low evenness has…',o:['Few species, equal numbers','Many species but one or two dominate','Many species in equal numbers','One species'],a:1,e:'Richness = how many species; evenness = how equally abundant.'},

{t:'e4',q:'Which vertebrate group is most at risk of extinction?',o:['Birds','Amphibians','Mammals','Reptiles'],a:1,e:'~41% of amphibians vs ~25% mammals, 21% reptiles, 14% birds.'},
{t:'e4',q:'Which is NOT an ecosystem service of biodiversity?',o:['Flood control','Pollination','Recreation','Transportation'],a:3,e:''},
{t:'e4',q:'Canada\'s federal law to prevent extinction/extirpation is…',o:['Endangered Species Act','Species at Risk Act (2002)','CITES','Ramsar'],a:1,e:'ESA is the U.S. law.'},
{t:'e4',q:'The ecosystem approach to conservation…',o:['Focuses on charismatic species like pandas','Protects whole ecosystems and their interactions, often hotspots','Relies on captive breeding','Ignores habitat'],a:1,e:'Single-species = charismatic animals, captive breeding.'},
{t:'e4',q:'Who keeps the Red List of Threatened Species?',o:['UN Environment','IUCN','WWF','Environment Canada'],a:1,e:'Since 1963.'},
{t:'e4',q:'Is ecological change after wolf reintroduction "succession"?',o:['Yes, all change is succession','Yes, vegetation changed','No — succession is community change following disturbance over time','No, animals can\'t affect plants'],a:2,e:'It\'s a trophic cascade, not succession.'},

<script>// Procedural Math 1228 questions — fresh numbers every time.
(function(){
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const fact=n=>n<=1?1:n*fact(n-1);
const P=(n,r)=>fact(n)/fact(n-r);
const C=(n,r)=>fact(n)/(fact(r)*fact(n-r));
const gcd=(a,b)=>b?gcd(b,a%b):a;
const frac=(n,d)=>{const g=gcd(n,d);return d/g===1?String(n/g):`${n/g}/${d/g}`};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function mc(t,q,ans,wrongs,e){
  const opts=[String(ans)];
  for(const w of wrongs){const s=String(w);if(!opts.includes(s)&&opts.length<4)opts.push(s)}
  const num=Number(ans);let k=1;
  while(opts.length<4&&k<60){
   let v;
   if(Number.isFinite(num)){const step=Number.isInteger(num)?(1+R(0,3)):Math.max(0.01,Math.abs(num)*0.15);v=String(Math.round((num+k*(k%2?1:-1)*step)*10000)/10000)}
   else{const d=R(2,12),n=R(1,d-1);v=frac(n,d)}
   if(!opts.includes(v)&&!(Number(v)<0))opts.push(v);k++;
  }
  const sh=shuffle(opts.slice());return {t,q,o:sh,a:sh.indexOf(String(ans)),e,gen:true};
}
const G={
 h1(){const A=R(12,30),B=R(10,25),AB=R(3,Math.min(A,B)-2),U=A+B-AB+R(2,10);
  return mc('h1',`In a class of ${U} students, ${A} take French, ${B} take Spanish and ${AB} take both. How many take neither?`,U-(A+B-AB),[U-A-B,U-(A+B),A+B-AB,U-AB],`n(A∪B) = ${A}+${B}−${AB} = ${A+B-AB}. Neither = ${U}−${A+B-AB} = ${U-(A+B-AB)}.`)},
 h2(){const s=R(3,6),p=R(2,5),d=R(2,4);
  return mc('h2',`An outfit has a shirt (${s} choices), pants (${p}) and shoes (${d}). How many outfits?`,s*p*d,[s+p+d,s*p+d,s*p],`Multiplication principle: ${s}×${p}×${d} = ${s*p*d}.`)},
 h2b(){const n=R(3,5);const tot=Math.pow(2,n);
  return mc('h2',`A coin is flipped ${n} times. How many sequences have at least one head?`,tot-1,[tot,n,tot/2],`Count the opposite: total 2^${n} = ${tot}, minus the 1 all-tails sequence = ${tot-1}.`)},
 h3(){const n=R(5,8),r=R(2,4);
  return mc('h3',`How many ways can ${r} distinct prizes be awarded to ${n} people (no one wins twice)?`,P(n,r),[C(n,r),Math.pow(n,r),n*r],`Order matters → P(${n},${r}) = ${n}!/(${n}−${r})! = ${P(n,r)}.`)},
 h3b(){const n=R(5,8);
  return mc('h3',`In how many ways can ${n} people sit around a circular table?`,fact(n-1),[fact(n),fact(n-2),n],`Circular permutations: (n−1)! = ${n-1}! = ${fact(n-1)}.`)},
 h4(){const n=R(7,12),r=R(2,4);
  return mc('h4',`A committee of ${r} is chosen from ${n} people. How many committees are possible?`,C(n,r),[P(n,r),n*r,Math.pow(2,n)],`Order doesn't matter → C(${n},${r}) = ${C(n,r)}.`)},
 h4b(){const m=R(4,7),w=R(4,7);
  return mc('h4',`Choose a committee of 2 men and 2 women from ${m} men and ${w} women.`,C(m,2)*C(w,2),[C(m+w,4),C(m,2)+C(w,2),P(m,2)*P(w,2)],`C(${m},2)×C(${w},2) = ${C(m,2)}×${C(w,2)} = ${C(m,2)*C(w,2)}.`)},
 h5(){const a=R(2,3),b=R(2,3),c=R(1,3),n=a+b+c;const ans=fact(n)/(fact(a)*fact(b)*fact(c));
  return mc('h5',`${n} students are split into labelled groups of sizes ${a}, ${b} and ${c}. How many ways?`,ans,[fact(n),C(n,a),ans*2],`Multinomial: ${n}!/(${a}!·${b}!·${c}!) = ${ans}.`)},
 h5b(){const k=R(2,3),n=k*2;const lab=fact(n)/Math.pow(2,k);const ans=lab/fact(k);
  return mc('h5',`${n} people are split into ${k} UNLABELLED pairs. How many ways?`,ans,[lab,fact(n),C(n,2)],`Labelled: ${n}!/(2!)^${k} = ${lab}. The groups can't be told apart, so divide by ${k}! → ${ans}.`)},
 h6(){const r=R(2,6),b=R(2,6),n=r+b;
  return mc('h6',`A bag has ${r} red and ${b} blue marbles. Two are drawn without replacement. P(both red)?`,frac(C(r,2),C(n,2)),[frac(r*r,n*n),frac(r,n),frac(C(b,2),C(n,2))],`Equiprobable: C(${r},2)/C(${n},2) = ${C(r,2)}/${C(n,2)} = ${frac(C(r,2),C(n,2))}.`)},
 h6b(){const s=R(5,10);
  return mc('h6',`Two fair dice are rolled. What is P(sum = ${s})?`,frac(6-Math.abs(7-s),36),[frac(1,6),frac(1,36),frac(s,36)],`Of 36 equally likely outcomes, ${6-Math.abs(7-s)} give a sum of ${s}.`)},
 h7(){const pA=R(3,6)/10,pB=R(3,6)/10,pAB=Math.round(pA*pB*100)/100;
  return mc('h7',`A and B are independent with P(A)=${pA} and P(B)=${pB}. Find P(A∩B).`,pAB,[Math.round((pA+pB)*100)/100,Math.round((pA+pB-pAB)*100)/100,pA],`Independent → P(A∩B) = P(A)·P(B) = ${pAB}.`)},
 h7b(){const pAB=R(1,3)/10,pB=R(4,8)/10;const ans=Math.round(pAB/pB*1000)/1000;
  return mc('h7',`P(A∩B) = ${pAB} and P(B) = ${pB}. Find P(A | B) (to 3 decimals).`,ans,[Math.round(pAB*pB*1000)/1000,Math.round(pB/pAB*1000)/1000,pAB],`P(A|B) = P(A∩B)/P(B) = ${pAB}/${pB} = ${ans}.`)},
 h8(){const d=R(1,5)/100,sens=R(90,98)/100,fp=R(3,10)/100;const num=d*sens,den=num+(1-d)*fp;const ans=Math.round(num/den*1000)/1000;
  return mc('h8',`${Math.round(d*100)}% of people have a disease. The test is positive ${Math.round(sens*100)}% of the time if sick, and ${Math.round(fp*100)}% if healthy. P(sick | positive)? (3 dp)`,ans,[sens,Math.round(num*1000)/1000,Math.round((1-ans)*1000)/1000],`Bayes: (${d}·${sens}) / (${d}·${sens} + ${Math.round((1-d)*100)/100}·${fp}) ≈ ${ans}.`)},
 h9(){const n=R(4,6),k=R(1,n-1);const ans=Math.round(C(n,k)*Math.pow(0.5,n)*10000)/10000;
  return mc('h9',`A fair coin is tossed ${n} times. P(exactly ${k} heads)? (4 dp)`,ans,[Math.round(Math.pow(0.5,n)*10000)/10000,Math.round(k/n*10000)/10000,Math.round(C(n,k)/n*10000)/10000],`Repeated independent trials: C(${n},${k})(½)^${n} = ${C(n,k)}/${Math.pow(2,n)} = ${ans}.`)}
};
const byTopic={};Object.entries(G).forEach(([k,f])=>{const t=k.replace(/b$/,'');(byTopic[t]=byTopic[t]||[]).push(f)});
window.genMath=t=>{const fs=byTopic[t];return fs?fs[Math.floor(Math.random()*fs.length)]():null};
})();
</script>

function record(q,ok,sec){
 const t=todayStr();
 if(!q.gen){const r=S.q[q.id]||{box:0,due:t};r.box=ok?Math.min(4,r.box+1):0;r.due=addDays(t,[0,1,3,7,14][r.box]);r.last=t;S.q[q.id]=r}
 const ts=S.topic[q.t]||{n:0,ok:0,ew:0};ts.n++;ts.ok+=ok?1:0;ts.ew=ts.n===1?(ok?1:0):ts.ew*0.7+(ok?0.3:0);S.topic[q.t]=ts;
 S.rev=S.rev||{};const ev=S.rev[q.t]=S.rev[q.t]||[];let e=ev[ev.length-1];
 if(!e||e.d!==t){e={d:t,n:0,ok:0,lv:0};ev.push(e)}e.n++;e.ok+=ok?1:0;
 e.lv=Math.round(Math.max(0.15,Math.min(ts.ew,(e.ok+1)/(e.n+2)*1.15))*100)/100;
 const L=S.log[t]||{n:0,ok:0,sec:0};L.n++;L.ok+=ok?1:0;L.sec+=Math.min(sec,120);S.log[t]=L;
 S.xp+=ok?10:3;save();
}
function streak(){let s=0,d=todayStr();if(!S.log[d])d=addDays(d,-1);while(S.log[d]?.n>=5){s++;d=addDays(d,-1)}return s}
function pickQ(tid){
 if(isMath(tid)) return window.genMath(tid);
 const t=todayStr(), pool=QS.filter(q=>q.t===tid);
 const due=pool.filter(q=>!S.q[q.id]||S.q[q.id].due<=t);
 const src=due.length?due:pool;
 src.sort((a,b)=>(S.q[a.id]?.box||0)-(S.q[b.id]?.box||0)+Math.random()-.5);
 return src[0];
}
// Daily set: weak + due topics first, boosted by exam proximity
function buildDaily(courseId,n=S.settings.len){
 const today=todayStr(), w=[];
 (courseId?COURSES:myCourses()).filter(c=>!courseId||c.id===courseId).forEach(c=>{
  const st=courseStats(c); const boost=st.next? Math.max(1,4-st.next.days/5):1;
  c.topics.forEach(t=>{
   if(t.date>today && !courseId) return;
   if(isMath(t.id)||QS.some(q=>q.t===t.id)){
    const m=topicMastery(t.id); const up=t.date>today?0.3:1;
    w.push({tid:t.id,w:(1.15-m)*boost*up+(seen(t.id)?0:.4)});
   }
  });
 });
 const out=[],used=new Set();let guard=0;
 while(out.length<n&&w.length&&guard++<200){
  const tot=w.reduce((a,x)=>a+x.w,0);let r=Math.random()*tot,pick=w[0];
  for(const x of w){r-=x.w;if(r<=0){pick=x;break}}
  const q=pickQ(pick.tid); if(!q) continue;
  const key=q.gen?q.q:q.id; if(used.has(key)) continue; used.add(key); out.push(q); pick.w*=0.55;
 }
 return out;
}
function buildDiag(courseId){
 const c=COURSES.find(x=>x.id===courseId);
 return c.topics.filter(t=>t.date<=todayStr()).flatMap(t=>{const a=pickQ(t.id);const b=isMath(t.id)?null:pickQ(t.id);return [a,b&&b.id!==a?.id?b:null].filter(Boolean)}).slice(0,12);
}

 <div class="ccard c-mint" style="cursor:default">
  <div class="row between" style="margin-bottom:14px"><div class="row"><div class="glyph">${ICON.cal}</div><b style="font-size:18px;font-weight:600">${first.toLocaleDateString('en-CA',{month:'long',year:'numeric'})}</b></div>
  <div class="row" style="gap:6px"><button class="iconbtn" style="width:42px;height:42px;background:transparent;border:1.5px solid #0002;box-shadow:none" data-month="-1" aria-label="Previous month">‹</button><button class="iconbtn" style="width:42px;height:42px;background:transparent;border:1.5px solid #0002;box-shadow:none" data-month="1" aria-label="Next month">›</button></div></div>
  <div class="cal">${['M','T','W','T','F','S','S'].map(x=>`<div class="h">${x}</div>`).join('')}${cells}</div>
  <div class="row" style="gap:14px;margin-top:12px;font-size:12px;font-weight:500"><span class="row" style="gap:5px"><i style="width:10px;height:10px;border-radius:50%;background:var(--lav2)"></i>Exam</span><span class="row" style="gap:5px"><i style="width:6px;height:6px;border-radius:50%;background:var(--mintd)"></i>Practised</span></div>
 </div>
 <h2>Coming up</h2>
 <div class="stack">${upcoming.map(e=>`<div class="topic" data-cram="${e.c.id}" style="cursor:pointer;background:var(--${e.c.color})"><div class="glyph" style="width:46px;height:46px">${e.c.emoji}</div><div style="flex:1"><div class="nm">${esc(e.c.code)} · ${esc(e.name)}</div><div style="font-size:13px;opacity:.7">${e.days===0?'Today':e.days===1?'Tomorrow':`in ${e.days} days`} · ${Math.round(courseStats(e.c).know*100)}% ready</div></div><div class="go" style="width:44px;height:44px">${ICON.arrow}</div></div>`).join('')}</div>`;
}

function renderStats(){
 const days=[...Array(7)].map((_,i)=>addDays(todayStr(),i-6));
 const vals=days.map(d=>S.log[d]?.n||0), mx=Math.max(10,...vals);
 const cols=['var(--lav2)','var(--lemon)','var(--lav2)','var(--lavd)','var(--lemon)','var(--mint)','var(--lav)'];
 const total=Object.values(S.log).reduce((a,l)=>a+l.n,0), ok=Object.values(S.log).reduce((a,l)=>a+l.ok,0);
 const mins=Math.round(days.reduce((a,d)=>a+(S.log[d]?.sec||0),0)/60);
 const mastered=Object.keys(TOPIC).filter(t=>topicMastery(t)>=0.6).length;
 return `
 <h1>Your Progress</h1>
 ${(()=>{const mc=view.memC?COURSES.find(c=>c.id===view.memC):null;const mem=(mc?[mc]:myCourses()).map(c=>courseMemory(c,todayStr())||0);const avg=mem.reduce((a,b)=>a+b,0)/Math.max(1,mem.length);
 return `<div class="card" style="margin-bottom:14px">
  <div class="row between" style="flex-wrap:wrap;gap:10px"><div><b style="font-weight:600;font-size:18px">Memory</b><div class="muted" style="font-size:13px">${Math.round(avg*100)}% of what you've studied is still in your head today</div></div></div>
  <div class="pills" style="margin:12px 0 4px"><button class="pill ${!view.memC?'on':''}" data-memc="">All</button>${myCourses().map(c=>`<button class="pill ${view.memC===c.id?'on':''}" data-memc="${c.id}">${c.emoji} ${c.code.split(' ')[0]}</button>`).join('')}</div>
  ${memoryChart(mc,{back:28,fwd:21,h:220})}</div>`})()}
 <div class="grid2" style="grid-template-columns:1fr 1fr">
  <div class="stat c-lav"><div style="font-size:13px;font-weight:600;opacity:.7">Topics</div><div class="n" style="font-size:40px;margin-top:6px">${mastered}</div><div class="l">mastered of ${Object.keys(TOPIC).length}</div></div>
  <div class="stat c-lemon"><div style="font-size:13px;font-weight:600;opacity:.7">Study time</div><div class="n" style="font-size:40px;margin-top:6px">${mins}<span style="font-size:18px">m</span></div><div class="l">this week</div></div>
 </div>
 <div class="card" style="margin-top:14px">
  <div class="row between"><b style="font-weight:600">Questions per day</b><span class="chip" style="background:var(--bg)">This week</span></div>
  <div class="chart">${vals.map((v,i)=>`<div class="col"><div class="b ${v===Math.max(...vals)&&v>0?'top':''}" data-h="${Math.max(10,v/mx*100)}%" style="height:0;background:${cols[i]}"><span>${v}</span></div><small>${new Date(days[i]+'T12:00').toLocaleDateString('en-CA',{weekday:'short'})}</small></div>`).join('')}</div>
 </div>
 <div class="ccard c-mint row" style="margin-top:14px;cursor:default;gap:14px"><div style="font-size:34px">🏆</div><div><b style="font-weight:600">${total?`${Math.round(ok/total*100)}% accuracy`:'No answers yet'}</b><div style="font-size:13px;opacity:.75">${total} questions answered · ${S.xp} XP · best streak ${Math.max(S.best,streak())} days</div></div></div>
 <h2>Know vs. need to know</h2>
 <div class="stack">${myCourses().map(c=>{const s=courseStats(c);return `<div class="topic" data-course="${c.id}" style="cursor:pointer">${ring(s.know,colVar[c.color])}<div style="flex:1"><div class="nm">${esc(c.code)}</div><div class="bar" style="background:var(--bg);margin-top:8px"><i data-w="${s.overall*100}%" style="width:0;background:${colVar[c.color]}"></i></div><div class="muted" style="font-size:12px;margin-top:6px">${Math.round(s.overall*100)}% of the whole course · ${s.behind} behind</div></div></div>`}).join('')}</div>`;
}

function renderMe(){
 return `
 <h1>Profile</h1>
 <div class="card row" style="gap:16px"><div class="avatar" style="width:64px;height:64px;font-size:26px">${esc(S.name[0]||'?').toUpperCase()}</div><div style="flex:1"><div style="font-weight:600;font-size:18px">${esc(S.name)}</div><div class="muted" style="font-size:14px">${user?esc(user.email):'Not signed in · progress saved on this device only'}</div></div></div>
 ${user?'':`<button class="btn full" style="margin-top:14px" data-act="toauth">Create account to sync</button>`}
 <button class="btn light full" style="margin-top:14px" data-act="editcourses">Edit my courses (${myCourses().length})</button>
 <h2>Focus settings</h2>
 <div class="stack">
  <div class="topic"><div style="flex:1"><div class="nm">Questions per session</div><div class="muted" style="font-size:12px">Short sessions = easier to start</div></div>
   <div class="row" style="gap:6px">${[5,8,12].map(n=>`<button class="pill ${S.settings.len===n?'on':''}" data-len="${n}">${n}</button>`).join('')}</div></div>
  <div class="topic"><div style="flex:1"><div class="nm">Show focus timer</div><div class="muted" style="font-size:12px">A gentle clock, no pressure</div></div><button class="switch ${S.settings.timer?'on':''}" data-set="timer" aria-label="Toggle timer"></button></div>
  <div class="topic"><div style="flex:1"><div class="nm">Sounds</div><div class="muted" style="font-size:12px">Little dings on right answers</div></div><button class="switch ${S.settings.sound?'on':''}" data-set="sound" aria-label="Toggle sound"></button></div>
 </div>
 <h2>Install on your iPhone</h2>
 <div class="card" style="font-size:14px;line-height:1.6">Open this page in <b>Safari</b>, tap the <b>Share</b> button, then <b>Add to Home Screen</b>. Loop opens full-screen like a regular app.</div>
 ${user?`<button class="btn light full" style="margin-top:20px" data-act="signout">Sign out</button>`:''}
 <p class="muted" style="font-size:12px;text-align:center;margin-top:20px">Built from your OWL Brightspace courses · Fall 2026</p>`;
}

/* ---------- quiz ---------- */
let Q=null;
function startQuiz(list,title){
 if(!list.length) return toast('Nothing to practise here yet');
 Q={list,title,i:0,res:[],picked:null,t0:Date.now(),qStart:Date.now()};
 drawQ();
 clearInterval(Q.tick);Q.tick=setInterval(()=>{const el=$('#qtimer');if(el){const s=Math.floor((Date.now()-Q.t0)/1000);el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}},1000);
}
function drawQ(){
 let el=$('#quiz');if(!el){el=document.createElement('div');el.id='quiz';el.className='quiz';document.body.appendChild(el)}
 if(Q.i>=Q.list.length) return drawDone(el);
 if(Q.i>0&&Q.i%5===0&&!Q.breakShown){Q.breakShown=true;return drawBreak(el)}
 Q.breakShown=Q.i%5===0?Q.breakShown:false;
 const q=Q.list[Q.i],t=TOPIC[q.t],c=t.course;
 el.innerHTML=`
 <div class="qtop"><button class="iconbtn" data-q="quit" aria-label="Close">${ICON.x}</button>
  <div class="dots">${Q.list.map((_,j)=>`<i class="${j<Q.i?(Q.res[j]?'ok':'no'):j===Q.i?'d':''}"></i>`).join('')}</div>
  ${S.settings.timer?'<span class="timer" id="qtimer">0:00</span>':''}</div>
 <div class="qcard c-${c.color}">
  <div class="qtag">${c.emoji} ${esc(c.code)} · ${esc(t.name)}</div>
  <div class="qtext">${esc(q.q)}</div>
 </div>
 <div class="opts">${q.o.map((o,j)=>`<button class="opt" data-opt="${j}"><span class="k">${j+1}</span><span>${esc(o)}</span></button>`).join('')}</div>
 <div id="why"></div>
 <div class="qfoot"><button class="btn full" id="nextb" data-q="next" style="visibility:hidden">Continue ${ICON.arrow}</button></div>
 <div class="kbd">Press <b>1</b><b>2</b><b>3</b><b>4</b> to answer · <b>Enter</b> to continue · <b>Esc</b> to stop</div>`;
 Q.picked=null;Q.qStart=Date.now();
}
function answer(j){
 if(Q.picked!==null)return;const q=Q.list[Q.i];Q.picked=j;const ok=j===q.a;Q.res[Q.i]=ok;
 record(q,ok,(Date.now()-Q.qStart)/1000);
 document.querySelectorAll('.opt').forEach((b,k)=>{b.classList.add(k===q.a?'ok':k===j?'no':'dim')});
 const praise=['Nice!','Nailed it!','Yes! 🎉','Brain power 💪','Exactly right'];const soft=['Not quite','Close one','Almost','Good try'];
 $('#why').innerHTML=`<div class="why"><b style="color:${ok?'var(--good)':'var(--bad)'}">${ok?praise[Math.random()*praise.length|0]:soft[Math.random()*soft.length|0]+' · it\'s '+esc(q.o[q.a])}</b>${esc(q.e||'')}</div>`;
 $('#nextb').style.visibility='visible';$('#nextb').focus({preventScroll:true});
 if(S.settings.sound) beep(ok);
 if(navigator.vibrate) navigator.vibrate(ok?15:[30,40,30]);
}
function drawBreak(el){
 const ok=Q.res.filter(Boolean).length;
 el.innerHTML=`<div style="margin:auto;text-align:center;max-width:360px">${MASCOT(170)}<h1 style="text-align:center;font-size:28px">Brain break 🌿</h1><p class="muted" style="line-height:1.5">${ok}/${Q.i} so far. Stretch, sip some water and breathe out slowly. Ready when you are.</p><button class="btn full" data-q="resume" style="margin-top:10px">Keep going ${ICON.arrow}</button><button class="muted" style="margin-top:14px;font-size:14px" data-q="finish">End here, that counts too</button></div>`;
}
function drawDone(el){
 clearInterval(Q.tick);
 const ok=Q.res.filter(Boolean).length,n=Q.res.length,pct=n?ok/n:0;
 const st=streak();S.best=Math.max(S.best,st);save();
 const weak=[...new Set(Q.list.filter((q,i)=>Q.res[i]===false).map(q=>TOPIC[q.t].name))].slice(0,3);
 el.innerHTML=`<div style="margin:auto;text-align:center;max-width:380px;width:100%">${MASCOT(160,pct<.5?'sad':'happy')}
  <h1 style="text-align:center;font-size:30px;margin-bottom:6px">${pct>=.8?'Amazing!':pct>=.5?'Solid work!':'You showed up, that\'s the win'}</h1>
  <p class="muted" style="margin:0 0 18px">${ok}/${n} correct · +${ok*10+(n-ok)*3} XP${st?` · ${ICON.fire} ${st}-day streak`:''}</p>
  ${weak.length?`<div class="card" style="text-align:left;margin-bottom:14px"><b style="font-weight:600">Revisit next time</b><div class="muted" style="font-size:14px;margin-top:6px;line-height:1.6">${weak.map(esc).join('<br>')}</div></div>`:''}
  <button class="btn full" data-q="close">Done</button>
  <button class="btn light full" style="margin-top:10px" data-q="again">One more round</button></div>`;
 if(pct>=.6) confetti();
}
function beep(ok){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=ok?880:220;o.type='sine';g.gain.setValueAtTime(.08,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.25);o.start();o.stop(a.currentTime+.25)}catch{}}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=document.createElement('canvas');c.className='confetti';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const x=c.getContext('2d');const cols=['#B9A3E6','#7C5CD6','#CFE7E0','#FBEBB0','#FBDCCB','#3FB27F'];const P=[...Array(120)].map(()=>({x:innerWidth/2,y:innerHeight/2.5,vx:(Math.random()-.5)*14,vy:Math.random()*-14-4,s:Math.random()*8+4,c:cols[Math.random()*6|0],r:Math.random()*6}));let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.4;p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(f++<120)requestAnimationFrame(loop);else c.remove()})()}
function closeQuiz(){clearInterval(Q?.tick);$('#quiz')?.remove();Q=null;render()}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const b=e.target.closest('button,[data-course],[data-cram],[data-act]');if(!b)return;const d=b.dataset;
 if(d.opt!==undefined) return answer(+d.opt);
 if(d.q){({next:()=>{Q.i++;drawQ()},quit:()=>{if(Q.res.length)drawDone($('#quiz'));else closeQuiz()},resume:drawQ,finish:()=>{Q.list=Q.list.slice(0,Q.i);drawQ()},close:closeQuiz,again:()=>{const t=Q.title;closeQuiz();startQuiz(buildDaily(),t)}})[d.q]?.();return}
 if(d.tab){view.tab=d.tab;view.course=null;render();scrollTo(0,0);return}
 if(d.filter){view.filter=d.filter;render();return}
 if(d.memc!==undefined){view.memC=d.memc||null;render();return}
 if(d.pick){S.courses=S.courses||[];const i=S.courses.indexOf(d.pick);i>=0?S.courses.splice(i,1):S.courses.push(d.pick);save();renderPick();return}
 if(d.act==='pickdone'){if(!S.courses?.length)return toast('Pick at least one course');S.picked=true;save();render();return}
 if(d.act==='editcourses'){S.picked=false;save();render();return}
 if(d.course){view.course=d.course;render();scrollTo(0,0);return}
 if(d.cram) return startQuiz(buildDaily(d.cram),'Cram');
 if(d.diag) return startQuiz(buildDiag(d.diag),'Check');
 if(d.month){const now=new Date(),ym=view.ym||[now.getFullYear(),now.getMonth()];const m=new Date(ym[0],ym[1]+ +d.month,1);view.ym=[m.getFullYear(),m.getMonth()];render();return}
 if(d.len){S.settings.len=+d.len;save();render();return}
 if(d.set){S.settings[d.set]=!S.settings[d.set];save();render();return}
 switch(d.act){
  case 'start':view.authMode='up';renderAuth();break;
  case 'signin':view.authMode='in';renderAuth();break;
  case 'toauth':view.authMode='up';renderAuth();break;
  case 'authswap':view.authMode=view.authMode==='up'?'in':'up';renderAuth();break;
  case 'guest':S.onboarded=true;save();render();break;
  case 'setname':{const v=$('#nm').value.trim();if(!v)return;S.name=v;S.onboarded=true;save();render();break}
  case 'daily':startQuiz(buildDaily(),'Daily');break;
  case 'back':view.course=null;render();break;
  case 'signout':sb.auth.signOut();break;
 }
});
document.addEventListener('keydown',e=>{
 if(!Q)return;
 if(['1','2','3','4'].includes(e.key)&&Q.picked===null&&$('.opt')) answer(+e.key-1);
 else if((e.key==='Enter'||e.key===' ')&&Q.picked!==null&&$('#nextb')){e.preventDefault();Q.i++;drawQ()}
 else if(e.key==='Escape') $('[data-q="quit"]')?.click();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nm')$('[data-act="setname"]').click()});

/* ---------- boot ---------- */
sb.auth.onAuthStateChange(async(ev,session)=>{
 const was=user?.id;user=session?.user||null;
 if(ev==='SIGNED_OUT'){S=structuredClone(BLANK);store.set('loop-state',S)}
 if(user&&S.owner&&S.owner!==user.id){S=structuredClone(BLANK)}
 if(user){S.owner=user.id}
 if(user&&was!==user.id){S.onboarded=true;if(!S.name)S.name=user.user_metadata?.name||user.email.split('@')[0];await pull();save()}
 if(!Q) render();
});
render();

</script>
</body>
</html>
